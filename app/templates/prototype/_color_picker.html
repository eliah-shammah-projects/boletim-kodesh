{# Escolha da cor de fita. Precisa de um x-data com `color` (hex) em volta. #}
<fieldset>
  <legend class="mb-2 font-medium">Cor de fita do shiur</legend>
  <div class="flex flex-wrap gap-2">
    {% for key, (name, hex) in d.SHIUR_COLORS.items() %}
    <label class="cursor-pointer" title="{{ name }}">
      <input type="radio" name="cor" value="{{ hex }}" class="peer sr-only" x-model="color">
      <span class="flex size-11 items-center justify-center rounded-full ring-offset-2 peer-checked:ring-2 peer-checked:ring-text peer-focus-visible:ring-2 peer-focus-visible:ring-primary" style="background: {{ hex }}">
        <span x-show="color === '{{ hex }}'" class="text-white">{{ icon("check", "size-5") }}</span>
      </span>
      <span class="sr-only">{{ name }}</span>
    </label>
    {% endfor %}
  </div>
</fieldset>
