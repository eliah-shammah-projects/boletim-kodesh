name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: mysql+pymysql://boletim:boletim@127.0.0.1:3307/boletim_test
      TAILWINDCSS_VERSION: v4.3.4
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt

      # Mesmo MySQL de teste do docker-compose (utf8mb4_unicode_ci).
      - name: Subir MySQL de teste
        run: docker compose up -d --wait db_test

      - name: Compilar CSS
        run: tailwindcss -i app/static/src/app.css -o app/static/dist/app.css --minify

      - name: pytest
        run: pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validar docker-compose
        run: docker compose config --quiet
      - name: Construir imagem
        run: docker build --target dev -t boletim-kodesh:ci .
