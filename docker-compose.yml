# Ambiente de desenvolvimento e de testes.
# Os dois bancos usam utf8mb4 / utf8mb4_unicode_ci.

x-mysql: &mysql
  image: mysql:8.4
  command:
    - --character-set-server=utf8mb4
    - --collation-server=utf8mb4_unicode_ci
  healthcheck:
    test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
    interval: 5s
    timeout: 5s
    retries: 30

services:
  db:
    <<: *mysql
    environment:
      MYSQL_DATABASE: boletim
      MYSQL_USER: boletim
      MYSQL_PASSWORD: boletim
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  db_test:
    <<: *mysql
    environment:
      MYSQL_DATABASE: boletim_test
      MYSQL_USER: boletim
      MYSQL_PASSWORD: boletim
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    tmpfs:
      - /var/lib/mysql

  app:
    build:
      context: .
      target: dev
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: mysql+pymysql://boletim:boletim@db:3306/boletim
      TEST_DATABASE_URL: mysql+pymysql://boletim:boletim@db_test:3306/boletim_test
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      db_test:
        condition: service_healthy

volumes:
  mysql_data:
